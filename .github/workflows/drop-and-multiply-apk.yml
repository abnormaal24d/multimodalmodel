name: Drop and Multiply APK

on:
  push:
    branches: [ drop-and-multiply-apk-build ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Reconstruct test project
        shell: bash
        run: |
          base64 -d drop-build/apk_min.b64 > /tmp/apk_min.zip
          unzip -q /tmp/apk_min.zip -d "$GITHUB_WORKSPACE/drop-build/project"
          mkdir -p "$GITHUB_WORKSPACE/drop-build/project/apk_min/builds"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-36"

      - name: Export Android debug APK
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.2
          godot_export_templates_download_url: https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=4.7.2
          relative_project_path: ./drop-build/project/apk_min
          presets_to_export: Android Debug
          export_debug: true
          cache: false
          use_preset_export_path: true
          verbose: true

      - name: Locate APK
        shell: bash
        run: |
          find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print
          test -f "$GITHUB_WORKSPACE/drop-build/project/apk_min/builds/DropAndMultiply-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DropAndMultiply-test-apk
          path: drop-build/project/apk_min/builds/DropAndMultiply-debug.apk
          if-no-files-found: error
