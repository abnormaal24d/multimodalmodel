name: Drop and Multiply APK

on:
  push:
    branches: [ drop-and-multiply-apk-build ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Reconstruct test project
        shell: bash
        run: |
          base64 -d drop-build/apk_min.b64 > /tmp/apk_min.zip
          unzip -q /tmp/apk_min.zip -d "$GITHUB_WORKSPACE/drop-build/project"
          mkdir -p "$GITHUB_WORKSPACE/drop-build/project/apk_min/builds"

      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -L --fail --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          rm -rf /tmp/templates && mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          godot --version

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.1" "platforms;android-36"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Validate Godot project
        shell: bash
        working-directory: drop-build/project/apk_min
        run: |
          set -euxo pipefail
          godot --headless --editor --quit --path .
          godot --headless --path . --quit-after 2

      - name: Export Android debug APK
        shell: bash
        working-directory: drop-build/project/apk_min
        run: |
          set -euxo pipefail
          mkdir -p builds
          godot --headless --verbose --path . --export-debug "Android Debug" builds/DropAndMultiply-debug.apk
          test -s builds/DropAndMultiply-debug.apk
          ls -lh builds/DropAndMultiply-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DropAndMultiply-test-apk
          path: drop-build/project/apk_min/builds/DropAndMultiply-debug.apk
          if-no-files-found: error
